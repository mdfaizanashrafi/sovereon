name: PR Quality Gates

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: 80
  MIN_APPROVALS: 2

jobs:
  # ============================================================
  # PR Metadata Validation
  # ============================================================
  pr-metadata:
    name: PR Metadata Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            The subject must start with a capital letter and not end with a period.

      - name: Check PR description
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            
            // Check if description is not empty
            if (body.trim().length < 10) {
              core.setFailed('PR description is too short. Please provide a meaningful description.');
            }
            
            // Check for required sections
            const requiredSections = ['Description', 'Changes'];
            for (const section of requiredSections) {
              if (!body.toLowerCase().includes(section.toLowerCase())) {
                core.warning(`PR description should include a "${section}" section.`);
              }
            }

  # ============================================================
  # Code Quality Checks
  # ============================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Check code formatting
        working-directory: ${{ matrix.app }}
        run: |
          # Check if prettier is configured
          if [ -f .prettierrc ] || [ -f .prettierrc.json ] || [ -f .prettierrc.js ]; then
            npx prettier --check "src/**/*.{ts,tsx,js,jsx}" || true
          else
            echo "No Prettier config found, skipping format check"
          fi

      - name: Run linting
        working-directory: ${{ matrix.app }}
        run: |
          if [ "${{ matrix.app }}" = "frontend" ]; then
            npm run lint || npx eslint . --ext .ts,.tsx
          else
            npx eslint . --ext .ts || echo "No ESLint config, skipping"
          fi

      - name: TypeScript strict check
        working-directory: ${{ matrix.app }}
        run: |
          if [ "${{ matrix.app }}" = "backend" ]; then
            npx tsc --noEmit --strict
          else
            npx tsc -b --force
          fi

  # ============================================================
  # Test Coverage Check
  # ============================================================
  coverage-check:
    name: Coverage Threshold
    runs-on: ubuntu-latest
    needs: [code-quality]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sovereon_test
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test backend coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/sovereon_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: |
          npm ci
          npx prisma generate
          npm run test:coverage || npm run test:run -- --coverage
          
          # Check coverage threshold
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(cat coverage/coverage-summary.json | jq -r '.total.lines.pct // 0')
            echo "Backend Coverage: $COVERAGE%"
            if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
              echo "::error::Backend coverage $COVERAGE% is below threshold $COVERAGE_THRESHOLD%"
              exit 1
            fi
          fi

      - name: Test frontend coverage
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage || npm run test:run -- --coverage
          
          # Check coverage threshold
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(cat coverage/coverage-summary.json | jq -r '.total.lines.pct // 0')
            echo "Frontend Coverage: $COVERAGE%"
            if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
              echo "::error::Frontend coverage $COVERAGE% is below threshold $COVERAGE_THRESHOLD%"
              exit 1
            fi
          fi

      - name: Post coverage comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let comment = '## 📊 Coverage Report\n\n';
            comment += '| Application | Coverage | Status |\n';
            comment += '|------------|----------|--------|\n';
            
            const apps = ['backend', 'frontend'];
            for (const app of apps) {
              try {
                const coveragePath = `${app}/coverage/coverage-summary.json`;
                if (fs.existsSync(coveragePath)) {
                  const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
                  const lines = coverage.total.lines.pct;
                  const status = lines >= 80 ? '✅' : '❌';
                  comment += `| ${app} | ${lines}% | ${status} |\n`;
                } else {
                  comment += `| ${app} | N/A | ⚠️ |\n`;
                }
              } catch (e) {
                comment += `| ${app} | Error | ⚠️ |\n`;
              }
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ============================================================
  # Security Check
  # ============================================================
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit (frontend)
        working-directory: frontend
        run: |
          npm ci --package-lock-only
          npm audit --audit-level=high || {
            echo "::warning::High severity vulnerabilities found in frontend"
            exit 0
          }

      - name: Run npm audit (backend)
        working-directory: backend
        run: |
          npm ci --package-lock-only
          npm audit --audit-level=high || {
            echo "::warning::High severity vulnerabilities found in backend"
            exit 0
          }

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  # ============================================================
  # Build Verification
  # ============================================================
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Build application
        working-directory: ${{ matrix.app }}
        env:
          NODE_ENV: production
        run: |
          if [ "${{ matrix.app }}" = "frontend" ]; then
            npm run build
          else
            npm run build
            npm run generate
          fi

      - name: Check bundle size
        if: matrix.app == 'frontend'
        working-directory: frontend
        run: |
          # Check if dist folder is too large
          SIZE=$(du -sb dist | cut -f1)
          MAX_SIZE=52428800  # 50MB in bytes
          
          if [ $SIZE -gt $MAX_SIZE ]; then
            echo "::warning::Bundle size (${SIZE} bytes) exceeds maximum (${MAX_SIZE} bytes)"
          else
            echo "✅ Bundle size OK: ${SIZE} bytes"
          fi

  # ============================================================
  # Check Approvals
  # ============================================================
  check-approvals:
    name: Check Required Approvals
    runs-on: ubuntu-latest
    steps:
      - name: Check PR approvals
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // Get reviews
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            
            // Count unique approvers
            const approvers = new Set(
              reviews
                .filter(r => r.state === 'APPROVED')
                .map(r => r.user.login)
            );
            
            console.log(`Found ${approvers.size} approvals from: ${Array.from(approvers).join(', ')}`);
            
            if (approvers.size < ${{ env.MIN_APPROVALS }}) {
              core.setFailed(`❌ PR requires at least ${{ env.MIN_APPROVALS }} approvals, but has ${approvers.size}`);
            } else {
              console.log(`✅ PR has ${approvers.size} approvals (required: ${{ env.MIN_APPROVALS }})`);
            }

  # ============================================================
  # PR Size Check
  # ============================================================
  pr-size-check:
    name: PR Size Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          # Count lines changed
          git fetch origin ${{ github.base_ref }}
          CHANGES=$(git diff --shortstat origin/${{ github.base_ref }}..HEAD)
          
          echo "Changes: $CHANGES"
          
          # Extract numbers
          FILES=$(echo "$CHANGES" | grep -oE '[0-9]+ file' | grep -oE '[0-9]+' || echo "0")
          INSERTIONS=$(echo "$CHANGES" | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo "0")
          DELETIONS=$(echo "$CHANGES" | grep -oE '[0-9]+ deletion' | grep -oE '[0-9]+' || echo "0")
          
          TOTAL=$((INSERTIONS + DELETIONS))
          
          echo "Files changed: $FILES"
          echo "Lines changed: $TOTAL"
          
          if [ $TOTAL -gt 1000 ]; then
            echo "::warning::PR is large ($TOTAL lines changed). Consider breaking it into smaller PRs."
          fi

  # ============================================================
  # Final Status
  # ============================================================
  pr-quality-gate:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    needs: [pr-metadata, code-quality, coverage-check, security-check, build-check]
    if: always()
    steps:
      - name: Evaluate quality gates
        run: |
          echo "## PR Quality Gates" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| PR Metadata | ${{ needs.pr-metadata.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage Check | ${{ needs.coverage-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Check | ${{ needs.security-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Check | ${{ needs.build-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.pr-metadata.result }}" = "success" ] && \
             [ "${{ needs.code-quality.result }}" = "success" ] && \
             [ "${{ needs.coverage-check.result }}" = "success" ] && \
             [ "${{ needs.security-check.result }}" = "success" ] && \
             [ "${{ needs.build-check.result }}" = "success" ]; then
            echo "✅ All quality gates passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some quality gates failed!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

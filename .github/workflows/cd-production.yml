name: CD - Production Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.2.3)'
        required: true
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  BLUE_PORT: 3001
  GREEN_PORT: 3002
  HEALTH_CHECK_RETRIES: 30
  HEALTH_CHECK_INTERVAL: 10

jobs:
  # ============================================================
  # Pre-deployment Checks
  # ============================================================
  pre-deployment-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify tag matches version
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format. Use semantic versioning (e.g., v1.2.3)"
            exit 1
          fi
          echo "✅ Version format is valid"

      - name: Check CI status
        run: |
          # Verify that the commit has passed CI
          echo "Checking CI status for ${{ github.sha }}..."
          # This would typically check the GitHub API for status checks

  # ============================================================
  # Build Production Images
  # ============================================================
  build-images:
    name: Build Production Images
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    outputs:
      backend-image: ${{ steps.build-backend.outputs.image }}
      frontend-image: ${{ steps.build-frontend.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/sovereon-backend:${{ steps.version.outputs.VERSION }}
            ${{ steps.login-ecr.outputs.registry }}/sovereon-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/sovereon-frontend:${{ steps.version.outputs.VERSION }}
            ${{ steps.login-ecr.outputs.registry }}/sovereon-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            VITE_API_URL=https://api.sovereon.online

      - name: Output image URIs
        run: |
          echo "Backend: ${{ steps.login-ecr.outputs.registry }}/sovereon-backend:${{ steps.version.outputs.VERSION }}"
          echo "Frontend: ${{ steps.login-ecr.outputs.registry }}/sovereon-frontend:${{ steps.version.outputs.VERSION }}"

  # ============================================================
  # Backup Database
  # ============================================================
  backup-database:
    name: Backup Database
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Create database backup
        run: |
          BACKUP_FILE="backup-$(date +%Y%m%d-%H%M%S).sql"
          
          # Create backup using pg_dump
          PGPASSWORD="${{ secrets.DB_PASSWORD }}" pg_dump \
            -h ${{ secrets.DB_HOST }} \
            -U ${{ secrets.DB_USER }} \
            -d ${{ secrets.DB_NAME }} \
            -F c \
            -f "$BACKUP_FILE"
          
          # Upload to S3
          aws s3 cp "$BACKUP_FILE" s3://${{ secrets.BACKUP_BUCKET }}/production/backups/
          
          # Clean up local file
          rm "$BACKUP_FILE"
          
          echo "✅ Database backup completed: $BACKUP_FILE"

      - name: Verify backup
        run: |
          # List recent backups
          aws s3 ls s3://${{ secrets.BACKUP_BUCKET }}/production/backups/ | tail -5

  # ============================================================
  # Deploy with Blue-Green Strategy
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images, backup-database]
    environment:
      name: production
      url: https://sovereon.online
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to production server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
          
          # Copy deployment files
          scp -r docker-compose.prod.yml scripts/deploy.sh $USER@$HOST:/opt/sovereon/
          
          # Execute blue-green deployment
          ssh $USER@$HOST << EOF
            cd /opt/sovereon
            
            # Determine which environment is currently active (blue or green)
            if docker-compose -f docker-compose.prod.yml ps | grep -q "app-blue"; then
              CURRENT_ENV="blue"
              NEW_ENV="green"
              NEW_PORT=${{ env.GREEN_PORT }}
            else
              CURRENT_ENV="green"
              NEW_ENV="blue"
              NEW_PORT=${{ env.BLUE_PORT }}
            fi
            
            echo "Current environment: $CURRENT_ENV"
            echo "Deploying to: $NEW_ENV on port $NEW_PORT"
            
            # Export deployment variables
            export DEPLOYMENT_ENV=production
            export IMAGE_TAG=${{ steps.version.outputs.VERSION }}
            export ACTIVE_ENV=$NEW_ENV
            export APP_PORT=$NEW_PORT
            export DATABASE_URL="${{ secrets.PRODUCTION_DATABASE_URL }}"
            export REDIS_URL="${{ secrets.PRODUCTION_REDIS_URL }}"
            export SESSION_SECRET="${{ secrets.PRODUCTION_SESSION_SECRET }}"
            export RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
            export FRONTEND_URL="https://sovereon.online"
            export API_URL="https://api.sovereon.online"
            export SENTRY_DSN="${{ secrets.SENTRY_DSN }}"
            
            # Make deploy script executable and run
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh --environment=$NEW_ENV
            
            # Store deployment info for potential rollback
            echo "$NEW_ENV:$IMAGE_TAG" > .last_deployment
          EOF

  # ============================================================
  # Run Database Migrations
  # ============================================================
  migrate-production:
    name: Production Database Migrations
    runs-on: ubuntu-latest
    needs: deploy-production
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Verify migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          npx prisma migrate status

  # ============================================================
  # Health Check and Switch Traffic
  # ============================================================
  health-check-and-switch:
    name: Health Check & Traffic Switch
    runs-on: ubuntu-latest
    needs: [deploy-production, migrate-production]
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Health check new environment
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
          
          # Get the new environment port
          NEW_PORT=$(ssh $USER@$HOST 'cd /opt/sovereon && grep NEW_PORT .last_deployment | cut -d: -f2 || echo "3002"')
          
          # Health check on the new environment
          for i in $(seq 1 ${{ env.HEALTH_CHECK_RETRIES }}); do
            echo "Attempt $i: Checking health on port $NEW_PORT..."
            if ssh $USER@$HOST "curl -sf http://localhost:$NEW_PORT/api/health"; then
              echo "✅ New environment is healthy"
              exit 0
            fi
            echo "⏳ Not ready yet, waiting..."
            sleep ${{ env.HEALTH_CHECK_INTERVAL }}
          done
          
          echo "❌ Health check failed"
          exit 1

      - name: Run smoke tests
        run: |
          # API smoke tests
          curl -sf https://api.sovereon.online/api/health || exit 1
          
          # Frontend smoke tests
          curl -sf https://sovereon.online | grep -q "Sovereon" || exit 1
          
          echo "✅ Smoke tests passed"

      - name: Switch traffic to new environment
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
          
          ssh $USER@$HOST << 'EOF'
            cd /opt/sovereon
            
            # Get new environment info
            read NEW_ENV NEW_TAG < .last_deployment
            
            # Update nginx to point to new environment
            sudo sed -i "s/pro_pass http:\/\/localhost:[0-9]*/proxy_pass http:\/\/localhost:$([ "$NEW_ENV" = "blue" ] && echo "3001" || echo "3002")/" /etc/nginx/sites-available/sovereon
            
            # Reload nginx
            sudo nginx -t && sudo nginx -s reload
            
            # Stop old environment after grace period
            sleep 60
            OLD_ENV=$([ "$NEW_ENV" = "blue" ] && echo "green" || echo "blue")
            docker-compose -f docker-compose.prod.yml stop app-$OLD_ENV || true
            
            echo "✅ Traffic switched to $NEW_ENV"
          EOF

  # ============================================================
  # Rollback on Failure
  # ============================================================
  rollback-on-failure:
    name: Rollback
    runs-on: ubuntu-latest
    needs: [deploy-production, migrate-production, health-check-and-switch]
    if: failure()
    steps:
      - name: Notify failure
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚨 Production deployment failed - initiating rollback",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 Production Deployment Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ github.ref }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Action:*\nAutomatic rollback initiated"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Execute rollback
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
          
          ssh $USER@$HOST << 'EOF'
            cd /opt/sovereon
            
            # Get current and previous environment
            if [ -f .last_deployment ]; then
              read FAILED_ENV FAILED_TAG < .last_deployment
              OLD_ENV=$([ "$FAILED_ENV" = "blue" ] && echo "green" || echo "blue")
              
              # Switch back to old environment
              sudo sed -i "s/proxy_pass http:\/\/localhost:[0-9]*/proxy_pass http:\/\/localhost:$([ "$OLD_ENV" = "blue" ] && echo "3001" || echo "3002")/" /etc/nginx/sites-available/sovereon
              sudo nginx -s reload
              
              # Stop failed environment
              docker-compose -f docker-compose.prod.yml stop app-$FAILED_ENV
              
              echo "✅ Rolled back to $OLD_ENV"
            else
              echo "No deployment history found for rollback"
            fi
          EOF

  # ============================================================
  # Notify Success
  # ============================================================
  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [health-check-and-switch]
    if: success()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Production deployment successful",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🎉 Production Deployment Successful"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ github.ref }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*URL:*\n<https://sovereon.online|sovereon.online>"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Create GitHub Release notes
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

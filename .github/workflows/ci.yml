name: CI - Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  COVERAGE_THRESHOLD: 80

jobs:
  # ============================================================
  # Lint Job - ESLint for both frontend and backend
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: ${{ matrix.app }}/node_modules
          key: ${{ runner.os }}-${{ matrix.app }}-node-${{ hashFiles(format('{0}/package-lock.json', matrix.app)) }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.app }}-node-

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ matrix.app }}
        run: |
          if [ "${{ matrix.app }}" = "frontend" ]; then
            npm run lint || npx eslint . --ext .ts,.tsx --max-warnings=0
          else
            npx eslint . --ext .ts --max-warnings=0 || echo "No ESLint config, skipping"
          fi

  # ============================================================
  # Type Check Job - TypeScript compilation check
  # ============================================================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: frontend
            cmd: npm run build
          - app: backend
            cmd: npx tsc --noEmit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: ${{ matrix.app }}/node_modules
          key: ${{ runner.os }}-${{ matrix.app }}-node-${{ hashFiles(format('{0}/package-lock.json', matrix.app)) }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.app }}-node-

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Run TypeScript check
        working-directory: ${{ matrix.app }}
        run: ${{ matrix.cmd }}

  # ============================================================
  # Test Job - Unit tests with coverage
  # ============================================================
  test:
    name: Test with Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, backend]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sovereon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: ${{ matrix.app }}/node_modules
          key: ${{ runner.os }}-${{ matrix.app }}-node-${{ hashFiles(format('{0}/package-lock.json', matrix.app)) }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.app }}-node-

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Setup test database (backend only)
        if: matrix.app == 'backend'
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/sovereon_test
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Run tests with coverage
        working-directory: ${{ matrix.app }}
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/sovereon_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: |
          if [ "${{ matrix.app }}" = "frontend" ]; then
            npm run test:coverage -- --reporter=json --reporter=html || npm run test:run -- --coverage
          else
            npm run test:coverage || npm run test:run -- --coverage
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: ${{ matrix.app }}/coverage/
          retention-days: 7

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ matrix.app }}/coverage
          flags: ${{ matrix.app }}
          name: ${{ matrix.app }}-coverage
          fail_ci_if_error: false

      - name: Check coverage threshold
        working-directory: ${{ matrix.app }}
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(cat coverage/coverage-summary.json | jq -r '.total.lines.pct // 0')
            echo "Coverage: $COVERAGE%"
            if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
              echo "::warning::Coverage $COVERAGE% is below threshold $COVERAGE_THRESHOLD%"
            fi
          fi

  # ============================================================
  # Build Job - Build both frontend and backend
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    strategy:
      matrix:
        app: [frontend, backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: ${{ matrix.app }}/node_modules
          key: ${{ runner.os }}-${{ matrix.app }}-node-${{ hashFiles(format('{0}/package-lock.json', matrix.app)) }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.app }}-node-

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Build application
        working-directory: ${{ matrix.app }}
        env:
          NODE_ENV: production
        run: |
          if [ "${{ matrix.app }}" = "frontend" ]; then
            npm run build
          else
            npm run build
            npm run generate
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.app }}
          path: |
            ${{ matrix.app }}/dist
            ${{ matrix.app }}/node_modules
          retention-days: 1

  # ============================================================
  # Security Scan Job - npm audit and dependency check
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        working-directory: ${{ matrix.app }}
        run: |
          npm audit --audit-level=high || {
            echo "::warning::High severity vulnerabilities found in ${{ matrix.app }}"
            exit 0
          }

      - name: Check for outdated dependencies
        working-directory: ${{ matrix.app }}
        run: |
          npm outdated || echo "Dependencies check completed"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './${{ matrix.app }}'
          format: 'sarif'
          output: 'trivy-${{ matrix.app }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-${{ matrix.app }}
          path: trivy-${{ matrix.app }}.sarif
          retention-days: 7

  # ============================================================
  # E2E Tests Job - Playwright tests for frontend
  # ============================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-node-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================================
  # Summary Job - Collect all results
  # ============================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, build, security-scan]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.lint.result }}" = "success" ] && \
             [ "${{ needs.type-check.result }}" = "success" ] && \
             [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.build.result }}" = "success" ] && \
             [ "${{ needs.security-scan.result }}" = "success" ]; then
            echo "✅ All checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some checks failed!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

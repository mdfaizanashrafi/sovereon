name: CD - Staging Deployment

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  DEPLOYMENT_TIMEOUT: 300
  HEALTH_CHECK_RETRIES: 30
  HEALTH_CHECK_INTERVAL: 10

jobs:
  # ============================================================
  # Deploy to Staging
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.sovereon.online
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/sovereon-backend:staging
            ${{ steps.login-ecr.outputs.registry }}/sovereon-backend:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=staging

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/sovereon-frontend:staging
            ${{ steps.login-ecr.outputs.registry }}/sovereon-frontend:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=staging
            VITE_API_URL=https://api-staging.sovereon.online

      - name: Deploy to staging server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
          
          # Copy deployment files
          scp -r docker-compose.prod.yml scripts/deploy.sh $USER@$HOST:/opt/sovereon/
          
          # Execute deployment
          ssh $USER@$HOST << 'EOF'
            cd /opt/sovereon
            
            # Set environment variables
            export DEPLOYMENT_ENV=staging
            export IMAGE_TAG=staging-${{ github.sha }}
            export DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}"
            export REDIS_URL="${{ secrets.STAGING_REDIS_URL }}"
            export SESSION_SECRET="${{ secrets.STAGING_SESSION_SECRET }}"
            export RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
            export FRONTEND_URL="https://staging.sovereon.online"
            export API_URL="https://api-staging.sovereon.online"
            export SENTRY_DSN="${{ secrets.SENTRY_DSN }}"
            
            # Make deploy script executable and run
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
          EOF

  # ============================================================
  # Run Database Migrations
  # ============================================================
  migrate-database:
    name: Database Migrations
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Verify migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          npx prisma migrate status

  # ============================================================
  # Health Check
  # ============================================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-staging, migrate-database]
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check backend health
        run: |
          for i in $(seq 1 ${{ env.HEALTH_CHECK_RETRIES }}); do
            echo "Attempt $i: Checking backend health..."
            if curl -sf https://api-staging.sovereon.online/api/health; then
              echo "✅ Backend is healthy"
              exit 0
            fi
            echo "⏳ Backend not ready yet, waiting..."
            sleep ${{ env.HEALTH_CHECK_INTERVAL }}
          done
          echo "❌ Backend health check failed"
          exit 1

      - name: Check frontend health
        run: |
          for i in $(seq 1 ${{ env.HEALTH_CHECK_RETRIES }}); do
            echo "Attempt $i: Checking frontend health..."
            if curl -sf https://staging.sovereon.online -o /dev/null; then
              echo "✅ Frontend is healthy"
              exit 0
            fi
            echo "⏳ Frontend not ready yet, waiting..."
            sleep ${{ env.HEALTH_CHECK_INTERVAL }}
          done
          echo "❌ Frontend health check failed"
          exit 1

      - name: Run smoke tests
        run: |
          # API smoke tests
          curl -sf https://api-staging.sovereon.online/api/health || exit 1
          
          # Frontend smoke tests
          curl -sf https://staging.sovereon.online | grep -q "Sovereon" || exit 1
          
          echo "✅ Smoke tests passed"

  # ============================================================
  # Rollback on Failure
  # ============================================================
  rollback-on-failure:
    name: Rollback
    runs-on: ubuntu-latest
    needs: [deploy-staging, migrate-database, health-check]
    if: failure()
    steps:
      - name: Notify failure
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Staging deployment failed and rollback initiated",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 Staging Deployment Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Execute rollback
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
          
          ssh $USER@$HOST << 'EOF'
            cd /opt/sovereon
            
            # Get previous stable image tag
            docker pull ${{ steps.login-ecr.outputs.registry }}/sovereon-backend:staging
            docker pull ${{ steps.login-ecr.outputs.registry }}/sovereon-frontend:staging
            
            # Stop current containers
            docker-compose -f docker-compose.prod.yml down
            
            # Deploy stable version
            export DEPLOYMENT_ENV=staging
            export IMAGE_TAG=staging
            docker-compose -f docker-compose.prod.yml up -d
            
            echo "✅ Rollback completed"
          EOF

  # ============================================================
  # Notify Success
  # ============================================================
  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [health-check]
    if: success()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Staging deployment successful",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🎉 Staging Deployment Successful"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*URL:*\n<https://staging.sovereon.online|staging.sovereon.online>"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
